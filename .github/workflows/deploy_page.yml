on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      
      - name: Install wasm-bindgen-cli from Binary
        run: |
          # Target version (change this to match your project's wasm-bindgen version)
          VERSION="0.2.130"
          
          # Download and extract the precompiled binary
          curl -L https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz | tar -xz
          
          # Move the binary to a directory already in the GitHub Actions PATH
          mkdir -p ~/.local/bin
          mv wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen ~/.local/bin
          
          # Verify installation
          wasm-bindgen --version
      
      - name: "Install nightly Rust toolchain"
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-23
          targets: wasm32-unknown-unknown
      
      - name: "Enable caching on Rust stuffs"
        uses: Swatinem/rust-cache@v2
        
      - name: Build the website!
        # Run my Rust based site generator, which is orchestrated
        # by make
        run: |
          cp configs/github_publish.mk ./local_config.mk
          make all
      
      - name: Upload to GitHub pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/web
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Permission for GITHUB_TOKEN
    # to allow deploy to GitHub pages
    permissions:
      pages: write
      id-token: write
    
    # Only one deploy can run at any time
    concurrency:
      group: "pages"
      cancel-in-progress: true
    steps:
      - name: Deploy the pages
        id: deployment
        uses: actions/deploy-pages@v5
