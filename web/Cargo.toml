[package]
name = "web"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

[features]
minify = [ "html_preprocess/minify", "dep:lightningcss" ]
built_in_server = [
  "dep:server",
]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
codemap = "0.1.3"
codemap-diagnostic = "0.1.2"
common-utils = { path = "../common-utils/" }
html-escape = "0.2.14"
html_preprocess = { path = "../html_preprocess" }
human_bytes = "0.4.3"
humantime = "2.4.0"
infer = { version = "0.19.0", default-features = false, features = ["alloc"] }
lightningcss = { version = "1.0.0-alpha.71", optional = true }
mime = "0.3.17"
mime2ext = "0.1.54"
mime_guess = "2.0.5"
server = { path = "../server/", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
art_data = { path = "../art_data" }
imagesize = { version = "0.15.0", default-features = false, features = ["png", "webp", "jpeg", "gif"] }
