cargo-features = ["per-package-target"]

[package]
name = "saps_emulators"
version = "0.1.0"
edition = "2024"

forced-target = "wasm32-unknown-unknown"

[lib]
crate-type = ["cdylib"]

[dependencies]
libcollege_saps = { version = "0.1.0", path = "college_saps/libcollege_saps" }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlInputElement", "DomTokenList"] }
