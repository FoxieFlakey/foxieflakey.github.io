[package]
name = "art-uploader"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.5", features = ["derive"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["form", "multipart", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["rt"] }
url = "2.5.8"
