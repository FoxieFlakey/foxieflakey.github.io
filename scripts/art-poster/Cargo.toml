[package]
name = "art-poster"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["form", "multipart", "query"] }
rustyline = { version = "19.0.0", features = ["derive", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
stringcase = "1.0.0"
thiserror = "2.0.21"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["fs", "io-std", "macros", "parking_lot", "process", "rt", "rt-multi-thread", "signal"] }
url = "2.5.8"
url-macro = "0.2.5"
urlencoding = "2.1.3"
